# Mục danh mục: agent điền tham số, người dùng duyệt cấu hình trước khi thêm.
id: kafka
title: Kafka
description: Đọc và chờ bản tin trên topic Kafka bằng consumer group tạm, không ảnh hưởng consumer thật.
plugin: '@aitest/action-kafka'
namespace: kafka
tools:
  read: [kafka_list_topics, kafka_read, kafka_wait_for]
  write: [kafka_produce]
params:
  - name: brokers
    type: string[]
    required: true
    description: Danh sách broker dạng host:port.
    example: ['127.0.0.1:9092']
  - name: ssl
    type: boolean
    description: Kết nối qua TLS.
  - name: saslMechanism
    description: Cơ chế xác thực SASL (plain, scram-sha-256, scram-sha-512); bỏ trống khi broker không yêu cầu.
  - name: saslUsername
    description: Tên đăng nhập SASL.
  - name: saslPassword
    secret: true
    description: Mật khẩu SASL, dạng ${env.TÊN}.
config:
  namespace: '{{namespace}}'
  brokers: '{{brokers}}'
  ssl: '{{ssl}}'
  sasl:
    mechanism: '{{saslMechanism}}'
    username: '{{saslUsername}}'
    password: '{{saslPassword}}'
write:
  allowProduce: true
usage: |
  Dùng kafka_wait_for với `since` là mốc trước khi gọi API, lọc theo mã nghiệp vụ bằng `match`.
