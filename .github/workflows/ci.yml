# Chạy typecheck, build giao diện và toàn bộ bài test trên Linux, Windows, macOS.
# Bài test dùng agent kịch bản nên không cần Kiro hay API key.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm web:build
      # Runner của GitHub có sẵn Google Chrome, nên bài test trình duyệt chạy được trên cả ba hệ điều hành.
      - run: pnpm test

  # Bài test sự kiện cần Kafka và RabbitMQ thật. Service container chỉ có trên runner Linux.
  brokers:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.1.0
        ports: ['9092:9092']
      rabbitmq:
        image: rabbitmq:4-management
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
    env:
      KAFKA_BROKERS: 127.0.0.1:9092
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Image Kafka không có health check sẵn: chờ cổng mở trước khi chạy test.
      - run: timeout 120 bash -c 'until (echo > /dev/tcp/127.0.0.1/9092) 2>/dev/null; do sleep 2; done'
      - run: pnpm vitest run packages/runner/tests/events.test.ts
