# Cấu hình nền tảng: mọi thành phần đều là plugin.
# Mỗi dòng gồm `id` (duy nhất), `name` (package hoặc đường dẫn) và `config`.
# Các service lõi (actions, plans, agents, prompt, runlog) được nạp sẵn;
# khai báo dòng có cùng `id` để thay cấu hình hoặc thay bằng bản triển khai khác.
plugins:
  - id: logger
    name: '@deepseek-ai/cordis-plugin-logger-console'
    config:
      levels: { base: 2 }

  - id: runlog
    name: aitest:runlog
    config:
      dir: .aitest/runs

  # Định dạng test plan
  - id: plan-yaml
    name: '@aitest/plan-yaml'

  # Hạ tầng thực thi
  - id: gateway
    name: '@aitest/mcp-gateway'
    config:
      serverName: aitest
  - id: verdict
    name: '@aitest/verdict'
  # Đầu vào của lượt chạy: người chạy điền, bước fill, agent chuẩn bị (prepare), mặc định; không đủ điều kiện thì blocked.
  - id: inputs
    name: '@aitest/inputs'
  - id: runner
    name: '@aitest/runner'
    config:
      agent: kiro
      caseTimeout: 300

  # Agent: Kiro qua ACP
  - id: agent-kiro
    name: '@aitest/agent-acp'
    config:
      name: kiro
      command: kiro-cli
      args: [acp]

  # Action
  - id: action-http
    name: '@aitest/action-http'
  - id: action-db
    name: '@aitest/action-sqlite'
    config:
      namespace: db
      file: ${env.ORDER_DB:-examples/order-api/orders.db}
      readonly: true
  # Kết nối ghi, chỉ dùng trong setup/teardown. Plan không khai báo `dbadmin` trong `requires`
  # nên agent không nhìn thấy action này.
  - id: action-dbadmin
    name: '@aitest/action-sqlite'
    config:
      namespace: dbadmin
      file: ${env.ORDER_DB:-examples/order-api/orders.db}
      readonly: false
  # Tính toán chính xác cho agent (tool `calc`), luôn khả dụng
  - id: action-math
    name: '@aitest/action-math'
  # Integration: chờ điều kiện bất đồng bộ và nhận callback
  - id: action-wait
    name: '@aitest/action-wait'
  - id: action-webhook
    name: '@aitest/action-webhook'

  # Ví dụ nối một MCP server bên ngoài thành action (bỏ `disabled` để dùng):
  - id: action-pg
    name: '@aitest/action-mcp-proxy'
    disabled: true
    config:
      namespace: pg
      transport: stdio
      command: npx
      args: ['-y', '@modelcontextprotocol/server-postgres', '${env.PG_URL}']

  # Guard
  - id: guard
    name: '@aitest/guard-basic'
    config:
      readOnlyNamespaces: [db]

  # Soạn plan cùng agent: chỉ dùng trong phiên soạn plan (scope `authoring`), không ảnh hưởng lượt chạy test.
  - id: authoring
    name: '@aitest/authoring'
  - id: authoring-catalog
    name: '@aitest/authoring/catalog'
    config:
      planDirs: [plans, examples/plans]
  - id: authoring-context
    name: '@aitest/authoring/context-files'
    config:
      sources:
        - id: order-spec
          title: Đặc tả Order API
          description: Yêu cầu nghiệp vụ, ràng buộc dữ liệu và giao diện của ứng dụng mẫu.
          paths: [examples/order-api/SPEC.md]
  - id: authoring-explore
    name: '@aitest/authoring/explore'
  # Catalog hệ thống dưới kiểm thử (systems/, envs/): biến {{<system>.url}}, mô tả service cho agent, kiểm tra tham chiếu trong plan.
  # Môi trường (envs/<tên>.yml): tool theo môi trường, chặn ghi, biến dùng chung; chọn bằng --env hoặc trên giao diện.
  - id: envs
    name: '@aitest/environments'
    config:
      default: ${env.AITEST_ENV:-local}
  - id: system-catalog
    name: '@aitest/system-catalog'
  - id: system-catalog-authoring
    name: '@aitest/system-catalog/authoring'
  # Danh mục tool đã kiểm duyệt (tool-catalog/*.yml): agent đề xuất, người dùng duyệt trong chat, row mới ghi vào patch layer.
  - id: tool-catalog
    name: '@aitest/tool-catalog'
  - id: authoring-validate
    name: '@aitest/authoring/validate'
    config:
      fixtureOnlyNamespaces: [dbadmin]
  - id: authoring-dry-run
    name: '@aitest/authoring/dry-run'
    config:
      maxCases: 3
  - id: authoring-save
    name: '@aitest/authoring/save'
    config:
      dir: plans

  # Tri thức của nhóm: lỗi đã biết, quy ước, bài học (thư mục kb/)
  - id: knowledge
    name: '@aitest/knowledge'
    config:
      dir: kb

  # Reporter
  - id: reporter-console
    name: '@aitest/reporters/console'
  - id: reporter-markdown
    name: '@aitest/reporters/markdown'
  - id: reporter-junit
    name: '@aitest/reporters/junit'
