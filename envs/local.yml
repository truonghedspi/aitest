# Môi trường chạy cục bộ, môi trường mặc định (AITEST_ENV, mặc định local).
# Dùng cấu hình tool trong aitest.yml, không ghi đè. Bí mật nằm trong cấu hình của tool qua ${env.TÊN}.
name: local
label: Máy cục bộ
systems:
  order-service:
    url: ${env.ORDER_API_URL:-http://127.0.0.1:4100}
brokers:
  # Broker trong catalog → namespace của tool kết nối tới broker đó.
  kafka-main: { namespace: kafka }
  rabbit-main: { namespace: rabbitmq }
