# Môi trường chạy cục bộ. Chọn môi trường bằng biến AITEST_ENV (mặc định local).
# Chỉ ghi địa chỉ và ánh xạ; bí mật nằm trong cấu hình của tool qua ${env.TÊN}.
name: local
systems:
  order-service:
    url: ${env.ORDER_API_URL:-http://127.0.0.1:4100}
brokers:
  # Broker trong catalog → namespace của tool kết nối tới broker đó.
  kafka-main: { namespace: kafka }
  rabbit-main: { namespace: rabbitmq }
